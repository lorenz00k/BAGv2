name: CI Pipeline

on: 
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Cancel outdated runs of the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
    backend:
        name: backend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        services:
          postgres:
            image: postgres:16-alpine
            env:
              POSTGRES_USER: test
              POSTGRES_PASSWORD: test
              POSTGRES_DB: bag_test
            ports:
              - 5432:5432
            options: >-
              --health-cmd "pg_isready -U test -d bag_test"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 10
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/bag_test
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: backend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm test
            - run: npm test:integration
            - run: npm audit --audit-level=high

    frontend:
        name: frontend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: frontend/package-lock.json
        - run: npm ci
        - run: npx tsc --noEmit
        - run: npm run lint
        - run: npm run build