services:
  db:
    image: postgres:16-alpine
    container_name: bag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: bag_database
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  db-test:
    image: postgres:16-alpine
    container_name: bag_postgres_test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: bag_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs: # data are put into RAM & are gone if stopped
      - /var/lib/postgresql/data 

  redis-test:
    image: redis:7-alpine
    container_name: bag_redis_test
    command: ["redis-server", "--save", ""]
    ports:
      - "127.0.0.1:6380:6379"
volumes:
  postgres_data:
