services:
  db:
    image: postgres:16-alpine
    container_name: bag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: bag_database
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bag_user -d bag_database"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: postgres://bag_user:${POSTGRES_PASSWORD}@db:5432/bag_database
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://bag_user:${POSTGRES_PASSWORD}@db:5432/bag_database
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
        NEXT_PUBLIC_GA_ID: ""
        NEXT_PUBLIC_VERCEL_ENV: development
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend


volumes:
  postgres_data: